# Automated dependency updates (ticket 48).
#
# Three resolved graphs have to stay current, and each one needs its own entry
# because Dependabot updates exactly the lockfile in `directory`:
#
#   /                   bun  -> the workspace `bun.lock` (root manifest,
#                               `desktop/` and `www/` workspace manifests). This
#                               is the graph the website deploy installs: it
#                               builds from the repository root.
#   /www                bun  -> the STANDALONE `www/bun.lock`, used when `www/` is
#                               installed on its own (an isolated site build). It
#                               is no longer a deploy input — see AGENTS.md
#                               "The website deploy builds from the repository
#                               root"
#   /desktop/src-tauri  cargo -> `Cargo.lock` for the Rust backend
#
# Coverage notes (verified, not assumed):
#
#   * Dependabot's `bun` ecosystem updates the text `bun.lock` only; a legacy
#     binary `bun.lockb` is not supported. `scripts/check-lockfiles.sh` (run by
#     the `checks` CI job) fails if either lockfile stops being a text lockfile,
#     so that coverage cannot silently disappear.
#   * The two bun entries are both required and are NOT redundant: the root
#     entry cannot update `www/bun.lock`, and the `/www` entry cannot update the
#     root `bun.lock`. A dependency bump in `www/package.json` therefore needs
#     both lockfiles regenerated in the same change — the root lockfile must
#     still satisfy `www/package.json` or `bun install --frozen-lockfile` fails,
#     which is exactly what `scripts/check-lockfiles.sh` reports.
#   * `overrides` (root `dompurify` / `fflate`, website `fflate`) are NOT
#     updated by Dependabot — no ecosystem support exists for override maps.
#     Those pins are security floors added by ticket 47 and are reviewed by
#     hand; `scripts/check-advisories.py` is what fails when a floor stops being
#     sufficient.
#   * GitHub Actions pins are deliberately not configured here: every action SHA
#     is asserted by `scripts/check-workflows.sh`, and rewriting a pinned SHA is
#     a release-pipeline change that should arrive as a reviewed commit rather
#     than as bot churn.
#
# Every update type is grouped, per entry (i.e. per ecosystem + directory), so a
# week's bumps arrive as at most a handful of reviewable PRs instead of one PR
# per package:
#
#   <entry>-minor-patch / cargo-patch -> routine bumps, mergeable as-is
#   <entry>-major                     -> majors, which are decisions, not merges
#
# Dependabot runs each `groups:` bucket (each distinct `update-types` set) as its
# own group, so a minors/patch group and a majors group coexisting inside one
# entry is expected: within a week a graph gets at most one minors/patch PR plus
# one majors PR.
#
# Why group majors at all: with only the minor/patch groups, a single weekly run
# produced 13 PRs, 11 of them bumps that could not pass CI (typescript 5.8 -> 7,
# vite 7 -> 8, redis 0.27 -> 1.8, @vitejs/plugin-react 4 -> 6, @astrojs/react
# 6 -> 7, vitest 4 -> 5, satori 0.33 -> 0.63, rusqlite, sha1, sha2,
# keyring-store). Eleven permanently-red PRs hide real signal. A majors group
# per entry keeps that decision in one reviewable PR, where a bump that cannot
# be landed is closed or split rather than left to rot — while the pre-1.0 bumps
# in that list (a `0.x -> 0.y` move is a *minor* by semver, whatever its blast
# radius) stay covered by the minor/patch group, so neither bucket can fall back
# to one PR per package.
#
# `open-pull-requests-limit` is 3 per entry (down from 5) because grouping, not
# the cap, is what bounds the volume — the cap only has to leave room for the
# minors/patch PR, the majors PR and a possible security PR at the same time.
#
# Security updates use the same three entries, and `scripts/check-advisories.py`
# is the backstop that does not depend on Dependabot at all.

version: 2
updates:
  # Root Bun workspace -> `bun.lock`.
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(deps)'
    groups:
      bun-workspace-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
      bun-workspace-major:
        patterns: ['*']
        update-types: ['major']

  # Standalone website install -> `www/bun.lock` (an isolated `www/` build, not the
  # deployed one: the deploy installs the workspace `bun.lock` from the root).
  - package-ecosystem: 'bun'
    directory: '/www'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(www-deps)'
    groups:
      www-standalone-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
      www-standalone-major:
        patterns: ['*']
        update-types: ['major']

  # Rust backend -> `desktop/src-tauri/Cargo.lock`.
  - package-ecosystem: 'cargo'
    directory: '/desktop/src-tauri'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(deps)'
    groups:
      cargo-patch:
        patterns: ['*']
        update-types: ['patch']
      cargo-major:
        patterns: ['*']
        update-types: ['major']
