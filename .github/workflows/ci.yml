name: CI

# Pull-request validation for the Tauri desktop app: Rust formatting + unit
# tests, frontend unit tests, and the frontend production build. Deliberately
# separate from release.yml — no secrets, no bundling, read-only permissions.
#
# `pull_request` (never `pull_request_target`) so a fork PR cannot reach a
# write-scoped token.

on:
  pull_request:
    branches: [prod]
  workflow_dispatch:

# Default-deny: the single job below grants the one scope it uses.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: fmt + tests + build
    runs-on: ubuntu-22.04
    # Bounded runtime: a hung `cargo test` cannot burn a runner for hours.
    timeout-minutes: 30
    # Read-only: this job only checks out and tests.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Asserts the release pipeline's trust rules (one pipeline, pinned
      # actions, job-scoped tokens, tag metadata as data) before anything is
      # built. See scripts/check-workflows.sh.
      - name: Check release pipeline hygiene
        run: ./scripts/check-workflows.sh

      # Tauri v2 needs these to compile the crate on Linux. Same list as
      # release.yml, so a missing system dependency surfaces on the PR
      # instead of during a release.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master; toolchain selected by input
        with:
          toolchain: stable
          components: rustfmt

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: './desktop/src-tauri -> target'

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check Rust formatting
        working-directory: desktop/src-tauri
        run: cargo fmt --all --check

      - name: Run Rust tests
        working-directory: desktop/src-tauri
        run: cargo test

      - name: Run frontend tests
        run: bun run test

      - name: Build the desktop frontend
        run: bun run --filter gridline-desktop build
